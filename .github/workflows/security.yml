name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # Monday morning: catch CVEs disclosed since the last push

# Read-only by default. Jobs that need more ask for it explicitly.
permissions: read-all

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks needs history to scan every commit in the PR
      - name: gitleaks (diff)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # The action above only scans the commits in this push or PR. That misses a secret that
      # entered on an earlier commit and is still sitting in the tree -- exactly how a CLI
      # transcript quoting a PyPI token once survived in main. This second pass
      # scans the checked-out files themselves, so anything present in HEAD is caught no matter
      # which commit put it there.
      - name: gitleaks (working tree)
        run: |
          VER=8.30.1
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks dir . --no-banner --redact --exit-code 1

  deps:
    name: dependency CVEs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # The Go equivalent of the upstream pip-audit job. govulncheck is better than a
      # manifest audit: it reports only vulnerabilities on code paths this module can
      # actually reach, so it does not fail on a CVE in an unused corner of a dependency.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Audit reachable code paths
        run: govulncheck ./...

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@v3
        with:
          languages: go
          queries: security-extended
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  supply_chain:
    name: no unsafe deserialization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This job is the Go translation of the upstream policy, not of the upstream
      # mechanism. Upstream grepped laya/ for pickle and torch.load because laya
      # downloads checkpoints from the Hub, so a pickle path would be remote code
      # execution on `laya.load("someone/their-model")`. Go has no pickle, but it has
      # encoding/gob, which is just as happy to be pointed at a hostile byte stream,
      # and os/exec, which is how a "just shell out to the converter" shortcut becomes
      # the same hole.
      #
      # These pass trivially while the port has no runtime code. That is the point:
      # they are a ratchet that is already in place when internal/hub and
      # internal/backend land (PLAN.md tasks 6.2 and 6.4).
      #
      # The other half of PLAN.md R7 cannot be a grep and is NOT covered here:
      # verifying safetensors and ONNX headers before use, and checking each
      # download's ETag/sha against Hub metadata. Those are assertions in the loader
      # and are tracked as acceptance criteria on tasks 6.2 and 6.4.
      - name: No gob decoding of downloaded artefacts
        run: |
          # encoding/gob decodes into arbitrary registered types and is not safe on
          # untrusted input. Checkpoints must go through safetensors or ONNX.
          if git ls-files '*.go' | grep -v '_test\.go$' | grep -v '^original/' \
               | xargs -r grep -nE '"encoding/gob"'; then
            echo "::error::encoding/gob in the shipped package - use safetensors or ONNX"
            exit 1
          fi
          echo "OK: no encoding/gob outside tests"

      - name: No shelling out from the shipped package
        run: |
          # A subprocess launched with a path derived from a downloaded artefact is the
          # Go spelling of the upstream subprocess/eval finding.
          if git ls-files '*.go' | grep -v '_test\.go$' | grep -v '^original/' \
               | xargs -r grep -nE '"os/exec"'; then
            echo "::error::os/exec in the shipped package"
            exit 1
          fi
          echo "OK: no os/exec outside tests"

      - name: No filesystem replace directives
        run: |
          # A `replace` pointing at a local path makes the build depend on code that is
          # not in this repo and not in go.sum, so nothing above can vouch for it.
          # PLAN.md task 4.3 vendors a forked tokenizer; vendoring it into this
          # repository is fine, pointing go.mod outside the repository is not.
          if grep -nE '^\s*replace\s' go.mod | grep -E '=>\s*(\.|/)'; then
            echo "::error::go.mod replaces a module with a filesystem path"
            exit 1
          fi
          echo "OK: no filesystem replace directives"
