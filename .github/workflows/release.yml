name: Release

# Tag a commit v0.2.1 and push it; this builds, verifies the version matches the tag,
# and opens a GitHub Release.
#
# There is no publish step. A Go module is consumed straight from the tag, so
# `go get github.com/MeKo-Christian/go-laya@v0.2.1` works the moment the tag exists
# and the proxy has fetched it. The upstream Python pipeline published to PyPI; that
# job is gone, and its trusted publisher was bound to NandhaKishorM/laya in any case.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Tests must pass before anything is released
        run: go test -race -count=1 ./...

      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v') # workflow_dispatch has no tag to match
        run: |
          # laya.go is the single source of truth (PLAN.md task 0.5). laya_test.go
          # pins the two properties this comparison relies on: that Version is valid
          # semver, and that it does not itself carry a leading v.
          pkg=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' laya.go)
          tag="${GITHUB_REF_NAME#v}"
          echo "laya.go=$pkg tag=$tag"
          if [ -z "$pkg" ]; then
            echo "::error::could not read Version out of laya.go - has the declaration been reformatted?"
            exit 1
          fi
          test "$pkg" = "$tag" || { echo "::error::laya.go Version $pkg does not match tag $tag"; exit 1; }

      - name: Build every package for the supported platforms
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            echo "--- $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build ./...
          done

  github_release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists - nothing to do"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
