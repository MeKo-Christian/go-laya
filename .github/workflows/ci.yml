name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # PLAN.md section 8 requires green on linux/amd64 and darwin/arm64.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -race -count=1 ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          # Pinned: `default: all` in .golangci.yml means a new linter in a new
          # release turns green into red without a commit in this repo.
          version: v2.12.2
          args: --timeout=5m ./...

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install formatters
        env:
          # Every version is pinned. treefmt --fail-on-change compares bytes, so an
          # upstream formatter release changing its output breaks CI on an unrelated PR.
          TREEFMT_VERSION: "2.5.0"
          PRETTIER_VERSION: "3.9.6"
          SHFMT_VERSION: "v3.12.0"
          GOFUMPT_VERSION: "v0.10.0"
          GCI_VERSION: "v0.14.0"
        run: |
          curl -sSL -o treefmt.tar.gz \
            "https://github.com/numtide/treefmt/releases/download/v${TREEFMT_VERSION}/treefmt_${TREEFMT_VERSION}_linux_amd64.tar.gz"
          tar -xzf treefmt.tar.gz treefmt
          sudo install -m 0755 treefmt /usr/local/bin/treefmt
          npm install -g "prettier@${PRETTIER_VERSION}"
          go install "mvdan.cc/gofumpt@${GOFUMPT_VERSION}"
          go install "github.com/daixiang0/gci@${GCI_VERSION}"
          go install "mvdan.cc/sh/v3/cmd/shfmt@${SHFMT_VERSION}"
          sudo apt-get update && sudo apt-get install -y shellcheck

      - uses: extractions/setup-just@v2

      - name: Check formatting
        run: just fmt-check

  markdown:
    name: markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # markdownlint is a checker here, never a formatter -- prettier owns Markdown
      # formatting. See the comment at the top of treefmt.toml for why.
      - run: npm install -g markdownlint-cli@0.42.0
      - uses: extractions/setup-just@v2
      - run: just lint-md

  tidy:
    name: go.mod is tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: extractions/setup-just@v2
      - run: just check-tidy
