# House formatting config. Run with `just fmt` (or `treefmt --allow-missing-formatter`),
# which is what CI checks via `just fmt-check`.
#
# Markdown is formatted by prettier only. markdownlint runs as a separate *checker*
# (never with --fix): prettier >=3.9 and markdownlint --fix disagree on markdown often
# enough that chaining both as formatters can fail to converge under --fail-on-change.
# `ruff check` is kept out of here for the same reason; it runs via `just lint-py`.

[global]
excludes = [
  "go.sum",
  "go.mod",
  "LICENSE",
  "NOTICE",
  "**/.gitignore",
  # Frozen upstream Python. It is the parity reference; reformatting it would make
  # every diff against upstream unreadable.
  "original/**",
  # Downloaded checkpoints. treefmt's default --walk=auto uses the git walker and so
  # already skips these, but prettier being handed a 34 MB tokenizer.json is not a
  # failure mode worth leaving to a default.
  "models/**",
  # Golden parity vectors (PLAN.md M1). Generated by scripts/dump_python_parity.py and
  # compared byte-for-byte, so nothing may reflow them. prettier claims *.json and not
  # *.jsonl, which is half the reason the corpus is JSONL -- but the fixtures are the
  # contract and that is not a distinction worth leaving to a glob.
  "testdata/*.jsonl",
  # Binary and generated artefacts.
  "*.png",
  "*.svg",
  "*.onnx",
  "*.safetensors",
  "coverage.txt",
  "coverage.html",
]

### Go

[formatter.gofumpt]
command = "gofumpt"
options = ["-w"]
includes = ["*.go"]

[formatter.gci]
command = "gci"
options = ["write", "-s", "standard", "-s", "default", "-s", "localmodule"]
includes = ["*.go"]
priority = 1 # run after gofumpt

### Markdown, YAML, JSON

[formatter.prettier]
command = "prettier"
options = ["-w"]
includes = ["*.md", "*.yaml", "*.yml", "*.json"]

### Python -- the reference harness in scripts/ only; original/** is excluded above

[formatter.ruff]
command = "ruff"
options = ["format"]
includes = ["*.py"]

### Shell

[formatter.shfmt]
command = "shfmt"
options = ["-s", "-w"]
includes = ["*.sh"]

[formatter.shellcheck]
command = "shellcheck"
includes = ["*.sh"]
priority = 1 # run after shfmt
